# Drop all non-HTTPS traffic on default server
server {

    server_name     "";

    listen          [::]:80;
    listen          80;
    
    return          444;
}
# Redirect HTTP to HTTPS
server {

    server_name     ~^(www\.)?metlinskyi.com$;

    listen          [::]:80;
    listen          80;

    include         certbot.conf;

    location / {
        return      301 https://metlinskyi.com$request_uri;
    }
}
# Redirect www to non-www
server {    

    server_name     ~^www\.metlinskyi.com$;

    listen          [::]:443 ssl;
    listen          443 ssl;
    http2           on;
    
    include         ssl/ssl.conf;
    
    return          301 https://metlinskyi.com$request_uri;
}
# Main server configuration
server {

    server_name     ~^(?!www\.)metlinskyi.com$;

    listen          [::]:443 ssl ipv6only=on;
    listen          443 ssl;
    http2           on;

    root            /var/www;

    include         api.conf;
    include         default.conf;
    include         public.conf;
    include         robots.conf;
    include         ssl/ssl.conf;
    include         static.conf;
    include         system.conf;
}
# gRPC server configuration
server {

    server_name     metlinskyi.com;
    default_type    application/grpc;
    
    listen          [::]:8080 ssl;
    listen          8080 ssl;
    http2           on;  

    include         grpc.conf;
    include         ssl/ssl.conf;
}   